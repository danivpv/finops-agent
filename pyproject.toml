[project]
name = "finops-agent"
version = "0.1.0"
description = "FinOps Agent for AWS"
readme = "README.md"
authors = [{ name = "danivpv", email = "danivpv@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
infra = [
    "aws-cdk-lib>=2.260.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "pydantic-settings>=2.7",
]
data = [
    "boto3>=1.40",
    "duckdb>=1.2",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic-settings>=2.7",
]
ai = [
    "bedrock-agentcore>=1.0",
    "boto3>=1.40",
    "httpx>=0.27",
    "mcp-proxy-for-aws>=1.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "strands-agents>=1.0",
]
dev = [
    "aws-sam-cli>=1.166.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.uv]
default-groups = ["dev", "infra", "data", "ai"]
# aws-sam-cli pins watchdog==4.0.2 exactly; strands-agents requires >=6.0.0.
# Neither actually needs the other's exact pin (we don't use `sam sync`'s
# file-watch loop), so force the newer watchdog to keep dev+ai in one venv.
override-dependencies = ["watchdog>=6.0.0"]

[tool.pytest.ini_options]
norecursedirs = ["cdk.out", ".venv", "dist", "build", "node_modules"]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:mangum",
]
